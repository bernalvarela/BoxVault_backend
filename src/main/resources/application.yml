server:
  port: 8088

spring:
  application:
    name: storage-management

  # Two profiles, one per database:
  #   dev — embedded H2, zero configuration; what you get when no profile is set
  #         (./mvnw spring-boot:run) and what the tests use (they activate "h2").
  #   pro — PostgreSQL, the server deployment: SPRING_PROFILES_ACTIVE=pro,
  #         set by docker-compose.yml.
  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  # Subida de ficheros adjuntos. El límite real lo pone
  # boxvault.storage.max-file-size (da un error legible); estos dos son la red de
  # seguridad del servidor y van algo por encima para que salte primero el nuestro.
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

boxvault:
  # Sesión y contraseñas. El secreto de firma no tiene valor por defecto: en el
  # servidor llega por variable de entorno (ver docker-compose.yml) y en
  # desarrollo lo pone el perfil "dev" de más abajo.
  security:
    access-token-minutes: 15
    refresh-token-days: 14
    secure-cookies: true
    bootstrap-username: ${BOXVAULT_ADMIN_USER:admin}
    bootstrap-password: ${BOXVAULT_ADMIN_PASSWORD:}
    jwt-secret: ${BOXVAULT_JWT_SECRET:}

  # Almacén de ficheros adjuntos. Por defecto, el disco: en desarrollo no hay que
  # levantar nada. El perfil "pro" lo cambia a S3 (RustFS).
  storage:
    type: local
    local-path: ${BOXVAULT_FILES_PATH:data/files}
    max-file-size: 10MB

  # Facturas y contratos. Quién emite sale de la ficha del PROPIETARIO de la
  # unidad (pantalla de Propietarios): su nombre, su NIF, su domicilio y su IBAN.
  # Lo de aquí es sólo el respaldo para lo que esa ficha no tenga, más la serie
  # de facturación y la plantilla del contrato. Lo que falte sale en el PDF como
  # un hueco visible, que se ve al mirarlo.
  invoicing:
    issuer-name: ${BOXVAULT_ISSUER_NAME:Comunidad de bienes Pasaxe 29}
    issuer-tax-id: ${BOXVAULT_ISSUER_TAX_ID:}
    issuer-address: ${BOXVAULT_ISSUER_ADDRESS:Avenida del Pasaje (A Pasaxe) 29}
    issuer-city: ${BOXVAULT_ISSUER_CITY:}
    issuer-email: ${BOXVAULT_ISSUER_EMAIL:}
    issuer-phone: ${BOXVAULT_ISSUER_PHONE:}
    issuer-iban: ${BOXVAULT_ISSUER_IBAN:}
    # Serie de facturación; el número queda A2026/0001, correlativo por año.
    invoice-series: ${BOXVAULT_INVOICE_SERIES:A}

---
# ---------------------------------------------------------------------
# dev — embedded H2 database, kept in memory, seeded by DataSeeder from
# seed-data.json on every start. The H2 web console is served at /h2-console
# (jdbc:h2:mem:storage_db, user "sa", empty password); it is a development tool
# and is not reachable under "pro", where the console stays disabled.
#
# "h2" activates the same document: it is the profile the tests declare.
# ---------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "dev | h2"
  datasource:
    url: jdbc:h2:mem:storage_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# En desarrollo la sesión se apaña sola: secreto fijo (no protege nada que
# importe, la base de datos se borra al parar), cookies sin exigir HTTPS porque
# se entra por http://localhost, y un administrador "admin" con una contraseña
# conocida. Nada de esto existe en "pro": allí todo viene del entorno.
boxvault:
  security:
    jwt-secret: "clave-de-desarrollo-que-no-protege-nada-solo-para-arrancar-en-local"
    secure-cookies: false
    bootstrap-username: admin
    bootstrap-password: "admin-local-2026"

---
# ---------------------------------------------------------------------
# pro — PostgreSQL, the server deployment (docker-compose.yml).
#
# The schema, its indexes and the historical data come from deploy/postgres/*.sql,
# which the database container loads once, when its volume is created. ddl-auto is
# left at "update" so a new entity field still adds its column by itself; it never
# drops anything, so the indexes defined in 01-schema.sql stay as they are.
#
# The tax filings are the one thing the SQL cannot carry (their snapshot is a
# report computed from the data), so DataSeeder registers them on the first start.
# ---------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: pro
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:boxvault}
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER:boxvault}
    password: ${POSTGRES_PASSWORD:boxvault}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Los adjuntos van al RustFS del compose, por la red interna: sin puerto
# publicado, sin TLS (no sale de la red del proyecto) y con las claves por
# entorno. El bucket se crea solo la primera vez que se sube algo.
boxvault:
  storage:
    type: s3
    endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
    bucket: ${RUSTFS_BUCKET:boxvault}
    access-key: ${RUSTFS_ACCESS_KEY:boxvault}
    secret-key: ${RUSTFS_SECRET_KEY:boxvault}
