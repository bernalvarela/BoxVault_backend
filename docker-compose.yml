# Server deployment of BoxVault from the image published by GitHub Actions.
#
#   export DOCKER_IMAGE=<docker-hub-user>/boxvault-backend:latest   # or put it in a .env file
#   export POSTGRES_PASSWORD=<a long random password>               # required, same file
#   export RUSTFS_ACCESS_KEY=<a user name> RUSTFS_SECRET_KEY=<another long random password>
#   docker compose pull && docker compose up -d
#
# The data lives in PostgreSQL, in the "boxvault-db" volume. The first time that
# volume is created - and only then - the database container runs the scripts in
# ./deploy/postgres: they create the tables with their indexes (01-schema.sql)
# and load the historical data (02-seed-data.sql). On every later start the
# database is left exactly as it is, so payments, expenses and registered tax
# returns survive restarts and image updates.
#
# Traefik runs in its own stack and reaches the app through the external
# "traefik-net" network; the database is only on the internal "boxvault-net", so
# nothing but the app can talk to it. Watchtower redeploys the app by itself
# whenever a new image is published (see the bottom of this file).
#
# Keep this file and ./deploy/postgres/*.sql together in the deployment
# directory (/share/Container/boxVault); see DEPLOY.md, step 3.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: boxvault-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boxvault}
      POSTGRES_USER: ${POSTGRES_USER:-boxvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Madrid
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/<major>/docker and
      # declares the volume one level up: mount /var/lib/postgresql, not
      # /var/lib/postgresql/data as the images up to 17 wanted.
      - boxvault-db:/var/lib/postgresql
      # Schema + initial data. Only read when the volume above is empty; the
      # entrypoint runs the .sql files in name order and ignores everything else.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    # No published port and no traefik-net on purpose: only the app, on the
    # internal network, reaches the database. Add "127.0.0.1:5432:5432" under a
    # "ports:" key to connect with psql from the NAS itself.
    # No watchtower label either: the database must never be upgraded to a new
    # major version unattended (it would refuse to start on the old data files).
    restart: unless-stopped
    networks: [boxvault-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Almacén de objetos de los ficheros adjuntos (copias del DNI, contratos de
  # trabajo, fotos...). Habla S3, así que el backend usa el SDK de AWS contra él.
  #
  # Como la base de datos: sólo en la red interna, sin puerto publicado y sin
  # traefik-net, de modo que nada fuera del proyecto lo alcanza. Por eso va por
  # HTTP: el tráfico no sale de la red del compose. Tampoco lleva la etiqueta de
  # watchtower: el almacén se actualiza a mano, mirando antes las notas de la
  # versión, no de madrugada y sin avisar.
  #
  # El bucket no hace falta crearlo: el backend lo crea la primera vez que sube
  # algo (S3FileStorage.ensureBucket).
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: boxvault-files
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    # Consola web de administración en la LAN, igual que el 8088 de la app: no
    # pasa por Traefik, así que no queda expuesta a Internet. El 9000 (la API S3)
    # sigue sin publicarse: solo la app lo alcanza por boxvault-net.
    ports:
      - "9001:9001"
    environment:
      # Un solo volumen: un único nodo con un único disco, que es lo que hay.
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # Consola web en http://<servidor>:9001; se entra con RUSTFS_ACCESS_KEY /
      # RUSTFS_SECRET_KEY, las mismas credenciales que usa la app.
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: info
      TZ: Europe/Madrid
    volumes:
      - boxvault-files:/data/rustfs0
    restart: unless-stopped
    networks: [boxvault-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RustFS corre como el usuario 10001; su volumen tiene que ser suyo. Se ejecuta
  # una vez, antes que él, y termina.
  rustfs-permissions:
    image: alpine
    container_name: boxvault-files-permissions
    volumes:
      - boxvault-files:/data0
    command: sh -c "chown -R 10001:10001 /data0"
    restart: "no"
    networks: [boxvault-net]

  boxvault:
    image: ${DOCKER_IMAGE:-boxvault-backend:latest}
    container_name: boxvault
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    # Direct LAN access, bypassing the Traefik router and therefore its basic
    # auth. Remove this block to make boxvault.duckdns.org the only way in.
    ports:
      - "8088:8088"
    environment:
      # Switches the datasource to PostgreSQL (see the "pro" profile in
      # application.yml). Without it the app falls back to "dev": in-memory H2.
      # The H2 console only exists under "dev", so nothing has to disable it here.
      SPRING_PROFILES_ACTIVE: pro
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-boxvault}
      POSTGRES_USER: ${POSTGRES_USER:-boxvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Almacén de los ficheros adjuntos: el RustFS de arriba, por la red interna.
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-boxvault}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      # Sesión: secreto de firma de los tokens (openssl rand -base64 48) y el
      # administrador que se crea la primera vez, si no hay ningún usuario. Esa
      # contraseña es provisional: la aplicación obliga a cambiarla al entrar.
      BOXVAULT_JWT_SECRET: ${BOXVAULT_JWT_SECRET:?set BOXVAULT_JWT_SECRET in .env}
      BOXVAULT_ADMIN_USER: ${BOXVAULT_ADMIN_USER:-admin}
      BOXVAULT_ADMIN_PASSWORD: ${BOXVAULT_ADMIN_PASSWORD:?set BOXVAULT_ADMIN_PASSWORD in .env}
      # Quién emite las facturas y los contratos: la comunidad de bienes. Sin el
      # NIF, la dirección y el IBAN los PDF salen con huecos visibles (....), que
      # es mejor que salir en blanco pero no vale para entregar.
      BOXVAULT_ISSUER_NAME: ${BOXVAULT_ISSUER_NAME:-Comunidad de bienes Pasaxe 29}
      BOXVAULT_ISSUER_TAX_ID: ${BOXVAULT_ISSUER_TAX_ID:-}
      BOXVAULT_ISSUER_ADDRESS: ${BOXVAULT_ISSUER_ADDRESS:-}
      BOXVAULT_ISSUER_CITY: ${BOXVAULT_ISSUER_CITY:-}
      BOXVAULT_ISSUER_EMAIL: ${BOXVAULT_ISSUER_EMAIL:-}
      BOXVAULT_ISSUER_PHONE: ${BOXVAULT_ISSUER_PHONE:-}
      BOXVAULT_ISSUER_IBAN: ${BOXVAULT_ISSUER_IBAN:-}
      # Native images accept the usual heap flags; far less is needed than on the JVM
      JAVA_OPTS: "-Xmx512m"
      TZ: Europe/Madrid
    volumes:
      # Kept from the H2 deployment: the old /data/boxvault.mv.db file is still in
      # there. Nothing writes to it any more; drop the volume once you no longer
      # need it as a backup of the pre-PostgreSQL data.
      - boxvault-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.boxvault-https.entrypoints: "websecure"
      traefik.http.routers.boxvault-https.rule: "Host(`boxvault.duckdns.org`)"
      traefik.http.routers.boxvault-https.tls: "true"
      traefik.http.routers.boxvault-https.tls.certresolver: "letsencrypt"
      traefik.http.services.boxvault.loadbalancer.server.port: "8088"
      # Sin basicauth de Traefik: desde la fase de autenticación, quien decide
      # quién entra es la propia aplicación, con su pantalla de login y los
      # permisos de cada usuario. Un candado delante para todos sobraba y además
      # tapaba el suyo.
    restart: unless-stopped
    # traefik-net to be reachable by the Traefik stack, boxvault-net to reach the database.
    networks: [traefik-net, boxvault-net]
    healthcheck:
      # The runtime image has no curl/wget; a bash TCP probe is enough to know the server is listening
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Copias de seguridad automáticas: cada noche, un volcado de la base de datos y
  # un tar de los ficheros adjuntos en ${BOXVAULT_BACKUP_DIR}, borrando los de
  # más de ${BACKUP_KEEP_DAYS} días. Sustituye al pg_dump a mano de DEPLOY.md,
  # que sólo protegía si alguien se acordaba de lanzarlo.
  #
  # Va sobre la misma imagen de PostgreSQL que el servidor: pg_dump tiene que ser
  # de la misma versión o más nueva que la base que vuelca, y así no hay que
  # acordarse de subirlo por separado. Trae busybox, o sea cron y tar, que es
  # todo lo que necesita.
  #
  # El volumen de los adjuntos se monta de SÓLO LECTURA: este contenedor no puede
  # estropear nada de lo que copia.
  backup:
    image: postgres:18.6-alpine
    container_name: boxvault-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-boxvault}
      POSTGRES_USER: ${POSTGRES_USER:-boxvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Cuándo se hace (formato cron) y cuántos días se guardan.
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # A "true" hace una copia nada más arrancar: útil la primera vez, para no
      # descubrir a las 3:30 que la carpeta no estaba bien montada.
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      TZ: Europe/Madrid
    volumes:
      - ./deploy/backup:/opt/backup:ro
      - boxvault-files:/data:ro
      # Dónde se guardan. Por defecto ./backups junto al compose; apunta esto a
      # un disco distinto del de los datos, o a un recurso de red, si puedes.
      - ${BOXVAULT_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/opt/backup/entrypoint.sh"]
    restart: unless-stopped
    networks: [boxvault-net]

  # Auto-update (CD). --label-enable means only the containers carrying
  # com.centurylinklabs.watchtower.enable=true are touched: the app, never the
  # database. Every 5 minutes it pulls ${DOCKER_IMAGE} and recreates "boxvault"
  # only when the image id changed; this replaces the deploy/update.sh cron job.
  watchtower:
    image: nickfedor/watchtower
    container_name: boxvault-watchtower
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # only if the Docker Hub repo is private (docker login on the server first):
      # - ~/.docker/config.json:/config.json:ro
    command: --label-enable --cleanup --interval 300
    networks: [boxvault-net]

volumes:
  boxvault-db:
  boxvault-data:
  # Los ficheros adjuntos. Va aparte de la base de datos a propósito: son lo
  # único que no está en el volcado de PostgreSQL, así que la copia de seguridad
  # tiene que incluir este volumen además de aquél.
  boxvault-files:

networks:
  # Created by the Traefik stack; this project only joins it.
  traefik-net:
    external: true
  # Private to this project: app <-> database.
  boxvault-net:
    driver: bridge
