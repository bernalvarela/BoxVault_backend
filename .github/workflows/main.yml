name: Build and push Docker image

# Every push runs the tests. Pushes to the default branch (master) and version tags
# v* also build the Docker image and push it to Docker Hub as <DOCKER_USERNAME>/boxvault-backend.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKER_USERNAME  Docker Hub user
#   DOCKER_PASSWORD  Docker Hub access token (Account settings > Security), not the password
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: boxvault-backend

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  docker:
    name: Docker image
    needs: test
    # Only publish from the default branch (master) and from version tags; PRs and other branches just get the tests
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Tags: latest (default branch), the short commit sha, and the version for v* tags (v1.2.3 -> 1.2.3, 1.2)
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
