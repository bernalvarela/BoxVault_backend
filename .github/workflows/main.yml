name: Build and Push Docker Image
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Push Image
        run: |
          mvn spring-boot:build-image -Dspring-boot.build-image.imageName=docker.io/${{ secrets.DOCKER_USERNAME }}/boxVault-backend:${{ github.sha }}
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image
        run: docker push docker.io/${{ secrets.DOCKER_USERNAME }}/boxVault-backend:${{ github.sha }}
