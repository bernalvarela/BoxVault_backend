name: Build and push Docker image

# Every push runs the tests. Pushes to the default branch (master) and version tags
# v* also build the Docker image and push it to Docker Hub as <DOCKER_USERNAME>/boxvault-backend.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKER_USERNAME  Docker Hub user
#   DOCKER_PASSWORD  Docker Hub access token (Account settings > Security), not the password
on:
  push:
    branches: ['**']
    tags: ['v*']
    # Cambiar un documento no cambia el binario: no se compila nada por eso.
    paths-ignore: ['**.md', '.gitignore', 'deploy/postgres/migrations/**']
  pull_request:
  workflow_dispatch:

# Dos empujones seguidos ya no compilan dos veces: el primero se cancela. Una
# compilación nativa son quince minutos largos de runner, y el binario del
# commit de en medio no lo quiere nadie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: boxvault-backend

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  docker:
    name: Native Docker image
    needs: test
    # Only publish from the default branch (master) and from version tags; PRs and other branches just get the tests
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Sitio en disco y colchón de memoria, antes de instalar nada.
      #
      # El runner trae instaladas cosas que aquí no pintan nada -.NET, el SDK de
      # Android, Haskell- y ocupan más de veinte gigas. Se tiran primero, porque
      # lo que viene después necesita ese sitio: el fichero de intercambio, los
      # 244 MB del binario y las capas de la imagen. La caché de herramientas
      # (AGENT_TOOLSDIRECTORY) NO se toca: ahí es donde setup-graalvm deja el
      # JDK un paso más abajo.
      #
      # El colchón: el runner tiene 8 GB y native-image pide más de 7, con un
      # pico real de 7,6 GB. Sin él, el sistema mata la compilación a media
      # faena ("exit status 137"), que es de donde venían los fallos
      # intermitentes. Va en /mnt, el disco efímero grande, cuando existe como
      # tal, y con nombre propio: el runner ya trae su /mnt/swapfile y pisarlo
      # en caliente sería peor que no hacer nada.
      - name: Sitio en disco y colchón de memoria
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo docker image prune -af || true

          colchon=/intercambio-extra
          if mountpoint -q /mnt; then colchon=/mnt/intercambio-extra; fi
          sudo fallocate -l 8G "$colchon"
          sudo chmod 600 "$colchon"
          sudo mkswap "$colchon"
          sudo swapon "$colchon"
          free -h
          df -h

      # GraalVM with the musl toolchain: the native binary is compiled here on the
      # runner (full CPU, ~/.m2 cached between runs) and only copied into the image
      # by Dockerfile.runtime, instead of compiling inside the Docker build stage.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          native-image-musl: 'true'
          cache: 'maven'

      # -Pnative-quick: "quick build" (-Ob), menos memoria y menos tiempo; ver
      # pom.xml. El límite corta una compilación encallada en vez de dejarla
      # consumiendo el runner hasta el tope de seis horas.
      - name: Compile native binary
        timeout-minutes: 45
        run: ./mvnw -B -Pnative,native-static,native-quick -DskipTests native:compile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Tags: latest (default branch), the short commit sha, and the version for v* tags (v1.2.3 -> 1.2.3, 1.2)
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The binary is already compiled: this only assembles the small runtime image
      # (the GHA cache keeps the apt-get layer warm between runs)
      - name: Build and push (native image)
        uses: docker/build-push-action@v7
        timeout-minutes: 15
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
